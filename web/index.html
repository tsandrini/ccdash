<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#f9f9f7"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0d0d0d"
      media="(prefers-color-scheme: dark)"
    />
    <title>ccdash</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="app.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="icon.svg" alt="" width="20" height="20" />
        <span>ccdash</span>
        <span class="muted" id="host"></span>
      </div>
      <nav class="tabs" role="tablist" aria-label="Views">
        <button role="tab" data-view="sessions" aria-selected="true">
          Sessions
        </button>
        <button role="tab" data-view="history" aria-selected="false">
          History
        </button>
        <button role="tab" data-view="analytics" aria-selected="false">
          Analytics
        </button>
      </nav>
      <div class="conn" id="conn" data-state="connecting" role="status">
        <span class="conn-dot"></span><span class="conn-label">connecting</span>
      </div>
      <button
        class="icon-btn"
        id="pair-btn"
        type="button"
        aria-label="Connect a phone"
        title="Connect a phone"
      >
        ▦
      </button>
      <button
        class="icon-btn"
        id="theme"
        type="button"
        aria-label="Switch theme"
      >
        ◐
      </button>
    </header>

    <main>
      <div
        class="scopebar"
        id="scopebar"
        role="radiogroup"
        aria-label="Workspace"
        hidden
      ></div>
      <section class="view" id="view-sessions">
        <div class="overview">
          <div class="hero">
            <div class="hero-value" id="hero-value">–</div>
            <div class="hero-label" id="hero-label">need you</div>
            <div class="hero-sub" id="hero-sub"></div>
          </div>
          <div class="tiles" id="tiles"></div>
        </div>
        <div id="groups"></div>
      </section>

      <section class="view" id="view-history" hidden>
        <div class="toolbar" id="history-toolbar"></div>
        <div id="history"></div>
      </section>

      <section class="view" id="view-analytics" hidden>
        <div class="toolbar" id="analytics-toolbar"></div>
        <div id="analytics"></div>
      </section>
    </main>

    <dialog id="detail" aria-labelledby="detail-title"></dialog>

    <dialog id="range-dialog" aria-label="Time range"></dialog>

    <dialog id="pair" aria-labelledby="pair-title"></dialog>

    <dialog id="login" aria-labelledby="login-title">
      <form class="login" method="dialog" id="login-form">
        <h2 id="login-title">Access token</h2>
        <p class="muted">
          Run <code>ccdash url --lan --qr</code> on the host and scan the code,
          or paste the token or the printed link here.
        </p>
        <p class="range-error" id="login-error" role="alert" hidden>
          That token was not accepted.
        </p>
        <input
          id="login-token"
          autocomplete="off"
          spellcheck="false"
          required
        />
        <button class="btn" type="submit">Connect</button>
      </form>
    </dialog>
  </body>
</html>
