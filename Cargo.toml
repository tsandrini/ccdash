[package]
name = "ccdash"
version = "0.1.0"
edition = "2024"
description = "Live dashboard for running Claude Code sessions"
authors = ["Tomáš Sandrini <t@tsandrini.sh>"]
license = "EUPL-1.2"
repository = "https://github.com/tsandrini/ccdash"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "query"] }
clap = { version = "4.6.7", features = ["derive"] }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
tokio = { version = "1.53.2", features = ["rt", "macros", "net", "io-util", "time", "process", "signal", "sync"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
strip = true
