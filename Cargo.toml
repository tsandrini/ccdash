[package]
name = "ccdash"
version = "0.1.0"
edition = "2024"
description = "Live dashboard for running Claude Code sessions"
authors = ["Tomáš Sandrini <t@tsandrini.sh>"]
license = "EUPL-1.2"
repository = "https://github.com/tsandrini/ccdash"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "query", "ws"] }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.31", default-features = false, features = ["sink"] }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
ring = { version = "0.17.14", features = ["std"] }
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
tokio = { version = "1.53.2", features = ["rt", "macros", "net", "io-util", "io-std", "time", "process", "signal", "sync"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[target.'cfg(unix)'.dependencies]
inotify = { version = "0.11.5", default-features = false }
libc = "0.2.190"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Wdk_System_Threading",
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Console",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Kernel",
  "Win32_System_Pipes",
  "Win32_System_Power",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Shell",
] }

[profile.release]
strip = true
